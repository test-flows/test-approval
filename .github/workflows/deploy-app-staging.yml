# Deploy app to staging (stg) environment
# Triggered by tags matching v*-rc.* (e.g. v1.2.3-rc.1).

name: deploy-app-staging

on:
  push:
    tags:
      - 'v*-rc.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-app-stg
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app.yml
    with:
      environment: stg
      tag: ${{ github.ref_name }}
